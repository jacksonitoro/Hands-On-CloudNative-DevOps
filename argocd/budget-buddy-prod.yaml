apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budget-buddy-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jacksonitoro/Hands-On-CloudNative-DevOps.git
    targetRevision: main
    path: charts/budget-buddy
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true