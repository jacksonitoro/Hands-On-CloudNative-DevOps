loki:
  enabled: true
  persistence:
    enabled: false
  isDefault: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

promtail:
  enabled: true
  config:
    clients:
      - url: http://logging-stack-loki:3100/loki/api/v1/push
        timeout: 30s
        backoff_config:
          min_period: 500ms
          max_period: 10s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

grafana:
  enabled: false
  sidecar:
    datasources:
      enabled: false
prometheus:
  enabled: false
