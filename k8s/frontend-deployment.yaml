apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-buddy-frontend
  labels:
    app: budget-buddy
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-buddy
      tier: frontend
  template:
    metadata:
      labels:
        app: budget-buddy
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: budget-buddy-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:5000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15